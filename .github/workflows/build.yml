name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -o tv-launcher-android.zip
      - run: gradle -p tv-launcher-android assembleDebug --no-daemon
      - run: cp tv-launcher-android/app/build/outputs/apk/debug/app-debug.apk tv-launcher.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: tv-launcher.apk
